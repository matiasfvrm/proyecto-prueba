<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fiverr Gig Thumbnail</title>
<style>
  @font-face { font-family: Anton; src: url(fonts/Anton.ttf); }
  @font-face { font-family: Mont; font-weight: 600; src: url(fonts/Montserrat-600.ttf); }
  @font-face { font-family: Mont; font-weight: 800; src: url(fonts/Montserrat-800.ttf); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; width: 100vw; max-width: 1920px; margin: 0 auto; }
</style>
</head>
<body>
<!-- Fiverr gig image ratio 1280x769, drawn at 1.5x and downscaled for crispness -->
<canvas id="c" width="1920" height="1154"></canvas>
<script src="media/manifest.js" onerror="window.MEDIA = {}"></script>
<script src="src/core.js"></script>
<script src="src/slots.js"></script>
<script>
const TW = 1920, TH = 1154;
const c = document.getElementById('c').getContext('2d');

function drawThumb() {
  // background: dark gradient + soft color blobs + grid
  c.fillStyle = '#07070d'; c.fillRect(0, 0, TW, TH);
  c.save(); c.globalCompositeOperation = 'screen';
  for (const [col, x, y, r] of [[C.pink, 250, 150, 900], [C.purple, 1500, 300, 900], [C.cyan, 1300, 1150, 800]]) {
    const g = c.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col + '55'); g.addColorStop(1, col + '00');
    c.fillStyle = g; c.fillRect(0, 0, TW, TH);
  }
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,.04)'; c.lineWidth = 1;
  for (let x = 0; x < TW; x += 80) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x, TH); c.stroke(); }
  for (let y = 0; y < TH; y += 80) { c.beginPath(); c.moveTo(0, y); c.lineTo(TW, y); c.stroke(); }

  // ---- right side: a landscape YouTube video behind three tilted phones
  const card = (id, t, x, y, w, h, rot, r, border) => {
    c.save(); c.translate(x, y); c.rotate(rot);
    c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 60; c.fillStyle = '#0d0d0d'; rr(c, -w / 2 - 14, -h / 2 - 14, w + 28, h + 28, r + 12); c.fill(); c.shadowBlur = 0;
    slotRect(c, id, t, -w / 2, -h / 2, w, h, r);
    if (border) { c.strokeStyle = border; c.lineWidth = 6; rr(c, -w / 2 - 14, -h / 2 - 14, w + 28, h + 28, r + 12); c.stroke(); }
    c.restore();
  };
  // landscape "YouTube" frame
  c.save(); c.translate(1500, 320); c.rotate(0.04);
  c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 60; c.fillStyle = '#0d0d0d'; rr(c, -430, -250, 860, 500, 26); c.fill(); c.shadowBlur = 0;
  slotRect(c, 'skate', 1.5, -410, -230, 820, 460, 16);
  c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(-410, 222, 820, 8); c.fillStyle = '#ff0033'; c.fillRect(-410, 222, 520, 8);
  c.restore();
  
  // phones
  card('dance', 2.0, 1180, 720, 290, 520, -0.12, 34, null);
  card('travel', 1.0, 1505, 770, 310, 560, 0.02, 36, null);
  card('food', 2.5, 1810, 720, 290, 520, 0.12, 34, null);
  platformIcon(c, 'youtube', 1860, 110, 120);
  platformIcon(c, 'tiktok', 1090, 480, 110);
  platformIcon(c, 'instagram', 1505, 1010, 110);
  platformIcon(c, 'facebook', 1860, 470, 100);
  // hearts / likes on the middle phone
  c.save(); c.translate(1600, 830); c.scale(0.5, 0.5); c.fillStyle = C.pink; c.fill(ICON.heart); c.restore();
  text(c, '248K', 1625, 900, { font: 'Mont', weight: 800, size: 26, glow: 'rgba(0,0,0,.8)', blur: 10 });

  // ---- left side: the message
  const L = 90;
  tag(c, 'PROFESSIONAL EDITOR', L, 140, { align: 'left', bg: C.pink, size: 30, ls: 5 });
  text(c, 'SOCIAL MEDIA', L, 300, { size: 150, align: 'left', color: '#fff' });
  const g = c.createLinearGradient(L, 0, L + 800, 0); g.addColorStop(0, C.yellow); g.addColorStop(1, '#ff9a3c');
  text(c, 'VIDEO EDITING', L, 455, { size: 150, align: 'left', color: g, glow: 'rgba(255,190,60,.45)', blur: 40 });
  text(c, 'Reels · TikToks · Shorts · YouTube', L + 4, 580, { font: 'Mont', weight: 800, size: 42, align: 'left', color: '#fff' });
  // feature checklist
  ['Captions & subtitles', 'Transitions & effects', 'Color grading & music', 'Fast delivery'].forEach((s, i) => {
    const x = L + (i % 2) * 450, y = 700 + Math.floor(i / 2) * 80;
    c.fillStyle = C.green; c.beginPath(); c.arc(x + 24, y, 24, 0, 7); c.fill();
    c.save(); c.translate(x + 4, y - 20); c.scale(0.4, 0.4); c.strokeStyle = '#fff'; c.lineWidth = 16; c.lineCap = 'round'; c.stroke(ICON.check); c.restore();
    text(c, s, x + 64, y + 2, { font: 'Mont', weight: 800, size: 30, align: 'left' });
  });
  // bottom strip: niches
  c.fillStyle = 'rgba(255,255,255,.08)'; rr(c, L, 900, 860, 100, 24); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.15)'; c.lineWidth = 2; c.stroke();
  text(c, 'GAMING · VLOGS · ADS · PODCASTS · MUSIC', L + 430, 952, { font: 'Mont', weight: 800, size: 28, ls: 2, color: C.cyan });
}

window.renderThumb = async () => { drawThumb(); await loadPending(); drawThumb(); return document.getElementById('c').toDataURL('image/png'); };
if (!navigator.webdriver) document.fonts.ready.then(async () => { drawThumb(); await loadPending(); drawThumb(); });
</script>
</body>
</html>
