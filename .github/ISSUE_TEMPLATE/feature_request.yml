name: Feature request
description: Suggest an improvement to the platform
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: principles
    attributes:
      label: Principles
      options:
        - label: This does not let unverified content appear as validated.
          required: true
