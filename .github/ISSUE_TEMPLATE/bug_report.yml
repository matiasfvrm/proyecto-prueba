name: Bug report
description: Something in the app does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to /problems\n2. …"
    validations: { required: true }
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Demo mode, Supabase mode, Not sure]
  - type: input
    id: env
    attributes:
      label: Browser and device
